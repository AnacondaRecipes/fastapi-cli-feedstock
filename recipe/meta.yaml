{% set name = "fastapi-cli" %}
{% set version = "0.0.32" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fastapi_cli-{{ version }}.tar.gz
  sha256: 38024d2345275e1b37ce8848727a580d84901b570e96b3256d9d36a9a5039424

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - fastapi = fastapi_cli.cli:main
  skip: true  # [py<310]
  # tmp
  skip: true  # [not win]

requirements:
  host:
    - python
    - pdm-backend
    - pip
  run:
    - python
    - rich-toolkit >=0.14.8
    - typer >=0.16.0
    - tomli >=2.0.0  # [py<311]
    - uvicorn-standard >=0.15.0
    # 'pydantic' is a missing runtime dependency and is not mentioned here https://github.com/fastapi/fastapi-cli/blob/0.0.32/pyproject.toml#L33-L38,
    # but it's used at runtime here https://github.com/fastapi/fastapi-cli/blob/0.0.32/src/fastapi_cli/cli.py#L7
    # and here https://github.com/fastapi/fastapi-cli/blob/0.0.32/src/fastapi_cli/config.py#L5.
    - pydantic >=2.0.0
  run_constrained:
    - fastapi-cloud-cli >=0.1.1
    - fastapi-new >=0.0.2

test:
  imports:
    - fastapi_cli
  source_files:
    - tests
    - scripts
  requires:
    - pip
    - pytest >=7.4.0,<10.0.0
    - fastapi >=0.128.0
    # 'test_script' requires coverage to run in a subprocess, see https://github.com/fastapi/fastapi-cli/blob/0.0.20/tests/test_cli.py#L527
    - coverage >=6.2,<8.0
  commands:
    # tmp test
    - pip check
    - where fastapi
    - dir "%PREFIX%\Scripts\fastapi*"
    - python -c "import fastapi_cli; print(fastapi_cli.__file__)"
    - python -m fastapi_cli.cli --help

    #- pip check
    #- fastapi --help
    #- fastapi --version
    #- fastapi dev --help
    #- fastapi run --help
    ## currently 'test_version' doesn't work properly if the optional fastapi-cloud-cli isn't present.
    ## E AssertionError: assert 'FastAPI Cloud CLI version:' in 'FastAPI CLI version: 0.0.32\n'
    #- pytest tests --deselect=tests/test_cli.py::test_version -vv

about:
  home: https://github.com/fastapi/fastapi-cli
  summary: Run and manage FastAPI apps from the command line with FastAPI CLI. 🚀
  description: |
    FastAPI CLI is a command line program fastapi that you can use to serve your FastAPI app,
    manage your FastAPI project, and more.
  dev_url: https://github.com/fastapi/fastapi-cli
  doc_url: https://fastapi.tiangolo.com/fastapi-cli
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - synapticarbors
